name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "template.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          echo "Role ARN secret length: ${#AWS_ROLE_ARN}"
          echo "Role ARN starts with: ${AWS_ROLE_ARN:0:20}"
          echo "Role ARN ends with: ${AWS_ROLE_ARN: -30}"
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | base64 -d | python3 -m json.tool
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - run: sam build
      - run: >-
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          --stack-name meetup-planner-api --resolve-image-repos
          --parameter-overrides
          DatabaseUrl='${{ secrets.DATABASE_URL }}'
          JwtSecret='${{ secrets.JWT_SECRET }}'
          OpenAiApiKey='${{ secrets.OPENAI_API_KEY }}'
